<style>
/* ── CHATBOT WIDGET — Charte Premium UGANC ── */
#chatbot-toggle {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  width: 58px; height: 58px;
  background: #7B1E3A;
  border: 3px solid #D4AF37;
  border-radius: 50%;
  color: white; font-size: 1.4rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 9999;
  box-shadow: 0 4px 20px rgba(123,30,58,0.45);
  transition: all 0.25s;
}
#chatbot-toggle:hover { background: #5c1129; transform: scale(1.08); box-shadow: 0 6px 25px rgba(123,30,58,0.55); }

#chatbot-window {
  position: fixed; bottom: 5.5rem; right: 1.5rem;
  width: 360px; max-width: calc(100vw - 2rem);
  height: 500px; max-height: calc(100vh - 8rem);
  display: none; flex-direction: column;
  border-radius: 18px;
  border: 2px solid #D4AF37;
  box-shadow: 0 20px 60px rgba(26,35,126,0.3);
  z-index: 9998; overflow: hidden;
  font-family: 'Segoe UI', Inter, Arial, sans-serif;
}
#chatbot-window.open { display: flex; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

/* En-tête */
#chatbot-header {
  background: #1565C0;
  border-bottom: 3px solid #D4AF37;
  color: white; padding: 0.9rem 1.1rem;
  display: flex; align-items: center; gap: 0.75rem;
}
#chatbot-header .bot-avatar {
  width: 36px; height: 36px; background: rgba(212,175,55,0.2);
  border: 2px solid #D4AF37; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
#chatbot-header .bot-info { flex: 1; }
#chatbot-header .bot-name  { font-weight: 800; font-size: 0.95rem; }
#chatbot-header .bot-status{ color: #D4AF37; font-size: 0.75rem; }
#chatbot-header .btn-close-chat {
  background: rgba(255,255,255,0.1); border: none; color: white;
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
#chatbot-header .btn-close-chat:hover { background: rgba(255,255,255,0.25); }

/* Corps messages */
#chatbot-body {
  flex: 1; overflow-y: auto; padding: 1rem;
  background: #F8FAFC;
  display: flex; flex-direction: column; gap: 0.75rem;
}
#chatbot-body::-webkit-scrollbar { width: 4px; }
#chatbot-body::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 2px; }

.msg-row-bot  { display: flex; align-items: flex-start; gap: 0.5rem; }
.msg-row-user { display: flex; align-items: flex-start; gap: 0.5rem; flex-direction: row-reverse; }

.msg-bot-avatar {
  width: 28px; height: 28px; background: #1565C0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 0.75rem; flex-shrink: 0; margin-top: 2px;
}

/* Message bot */
.msg-bot {
  background: #E3F2FD;
  color: #1A1A1A;
  border-radius: 0 14px 14px 14px;
  padding: 0.65rem 0.9rem;
  max-width: 78%;
  font-size: 0.87rem;
  border-left: 3px solid #1565C0;
  box-shadow: 0 2px 8px rgba(21,101,192,0.1);
  line-height: 1.5;
}
/* Message utilisateur */
.msg-user {
  background: #7B1E3A;
  color: white;
  border-radius: 14px 0 14px 14px;
  padding: 0.65rem 0.9rem;
  max-width: 78%;
  font-size: 0.87rem;
  box-shadow: 0 2px 8px rgba(123,30,58,0.2);
  line-height: 1.5;
}

/* Pied du chat */
#chatbot-footer {
  background: white;
  border-top: 2px solid #ECEFF1;
  padding: 0.7rem;
  display: flex; gap: 0.5rem;
}
#chatbot-input {
  flex: 1; border: 2px solid #e0e0e0; border-radius: 10px;
  padding: 0.55rem 0.9rem; font-size: 0.88rem;
  outline: none; transition: border-color 0.2s;
  font-family: inherit;
}
#chatbot-input:focus { border-color: #1565C0; box-shadow: 0 0 0 3px rgba(21,101,192,0.12); }
#chatbot-send {
  background: #1565C0; color: white; border: none;
  border-radius: 10px; padding: 0.55rem 1rem;
  font-weight: 700; font-size: 0.88rem;
  cursor: pointer; transition: background 0.2s;
}
#chatbot-send:hover { background: #1A237E; }

/* Typing indicator */
.typing-indicator { display: flex; gap: 4px; padding: 0.5rem 0.6rem; }
.typing-indicator span {
  width: 7px; height: 7px; background: #1565C0;
  border-radius: 50%; animation: bounce 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }
</style>

<!-- ── Toggle Button ── -->
<button id="chatbot-toggle" title="Assistant UGANC" onclick="toggleChatbot()">
  <i class="fa-solid fa-robot" id="chatbot-icon"></i>
</button>

<!-- ── Chatbot Window ── -->
<div id="chatbot-window">
  <div id="chatbot-header">
    <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
    <div class="bot-info">
      <div class="bot-name">Assistant UGANC</div>
      <div class="bot-status"><i class="fa-solid fa-circle" style="font-size:0.5rem;margin-right:4px;"></i>En ligne</div>
    </div>
    <button class="btn-close-chat" onclick="toggleChatbot()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div id="chatbot-body">
    <div class="msg-row-bot">
      <div class="msg-bot-avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="msg-bot">
        👋 Bonjour ! Je suis votre assistant UGANC.<br>
        Je peux vous aider à :<br>
        • Obtenir votre <strong>relevé de notes</strong><br>
        • Consulter vos <strong>résultats</strong><br>
        • Connaître votre <strong>statut de demande</strong><br><br>
        Tapez <em>aide</em> pour toutes les commandes.
      </div>
    </div>
  </div>

  <div id="chatbot-footer">
    <input id="chatbot-input" type="text" placeholder="Tapez votre message..." autocomplete="off"
           onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="chatbot-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<script>
function toggleChatbot() {
  const win  = document.getElementById('chatbot-window');
  const icon = document.getElementById('chatbot-icon');
  const open = win.classList.toggle('open');
  icon.className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-robot';
  if (open) document.getElementById('chatbot-input').focus();
}

function addMsg(text, type) {
  const body = document.getElementById('chatbot-body');
  const row  = document.createElement('div');
  row.className = type === 'user' ? 'msg-row-user' : 'msg-row-bot';
  if (type === 'bot') {
    const av = document.createElement('div'); av.className='msg-bot-avatar';
    av.innerHTML='<i class="fa-solid fa-robot"></i>'; row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = type === 'user' ? 'msg-user' : 'msg-bot';
  bubble.innerHTML = text;
  row.appendChild(bubble);
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
}

function sendMessage() {
  const inp = document.getElementById('chatbot-input');
  const msg = inp.value.trim();
  if (!msg) return;
  addMsg(msg, 'user');
  inp.value = '';

  // Typing indicator
  const body = document.getElementById('chatbot-body');
  const typing = document.createElement('div'); typing.id='typing'; typing.className='msg-row-bot';
  typing.innerHTML='<div class="msg-bot-avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-bot"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  body.appendChild(typing); body.scrollTop=body.scrollHeight;

  fetch("{% url 'chatbot_api' %}", {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
    body: JSON.stringify({ message: msg })
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById('typing')?.remove();
    addMsg(data.response || data.reponse || 'Désolé, je n\'ai pas compris.', 'bot');
  })
  .catch(() => {
    document.getElementById('typing')?.remove();
    addMsg('<span style="color:#C62828;">⚠️ Erreur de connexion. Veuillez réessayer.</span>', 'bot');
  });
}

function getCookie(name) {
  const m = document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
  return m ? m.pop() : '';
}
</script>
